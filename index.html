<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>P2P加密聊天 | 无服务端存储</title>
<style>
body{max-width:600px;margin:20px auto;padding:0 10px;}
#chat{height:320px;border:1px solid #ddd;padding:10px;overflow:auto;margin:15px 0;border-radius:4px;}
.msg{margin:6px 0;padding:4px;}
.you{color:#222;text-align:left;}
.me{color:#0066ff;text-align:right;}
.sys{color:#999;font-size:14px;text-align:center;}
input{padding:8px;width:220px;margin-right:8px;}
button{padding:8px 15px;cursor:pointer;}
</style>
</head>
<body>
<h3>🔒 端到端加密聊天</h3>
<input id="roomInput" placeholder="输入统一房间号">
<button onclick="createRoom()">进入房间</button>
<div id="chat"></div>
<input id="msgInput" placeholder="输入消息">
<button onclick="sendMessage()">发送</button>

<!-- 依赖库 -->
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script>
// 自定义加密密钥（双方必须一致）
const AES_KEY = "chat_encrypt_2026";
let peer = null;
let connection = null;
let roomId = "";

// AES 加密解密
function encrypt(text) {
  return CryptoJS.AES.encrypt(text, AES_KEY).toString();
}
function decrypt(cipher) {
  return CryptoJS.AES.decrypt(cipher, AES_KEY).toString(CryptoJS.enc.Utf8);
}

// 追加聊天内容
function addMsg(text, type) {
  const box = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// 初始化房间
function createRoom() {
  roomId = document.getElementById("roomInput").value.trim();
  if (!roomId) {
    alert("请填写房间号");
    return;
  }
  addMsg("正在连接...", "sys");

  // 以房间号作为PeerID，双人共用同一个ID配对
  peer = new Peer(roomId);

  // 自己作为主动连接方
  peer.on("open", (id) => {
    addMsg("房间已就绪，等待对方加入", "sys");
    // 连接同房间号的用户
    connection = peer.connect(roomId);
    bindConnEvent();
  });

  // 被对方连接
  peer.on("connection", (conn) => {
    connection = conn;
    bindConnEvent();
  });

  // 连接失败
  peer.on("error", (err) => {
    addMsg("连接出错：" + err.type, "sys");
  });
}

// 绑定连接事件
function bindConnEvent() {
  connection.on("open", () => {
    addMsg("✅ 连接成功，开始聊天", "sys");
  });

  // 接收加密消息并解密
  connection.on("data", (data) => {
    const txt = decrypt(data);
    addMsg("对方：" + txt, "you");
  });

  connection.on("close", () => {
    addMsg("连接已断开", "sys");
  });
}

// 发送消息
function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text || !connection || !connection.open) {
    alert("暂无可用连接");
    return;
  }
  // 加密后发送
  const cipherText = encrypt(text);
  connection.send(cipherText);
  addMsg("我：" + text, "me");
  input.value = "";
}
</script>
</body>
</html>
